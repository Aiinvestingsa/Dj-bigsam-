<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ BIGSAM RSA - Typing Only</title>
</head>
<body style="background:#000;color:#fff;font-family:Arial;padding:12px">

<h2 style="color:#22d3ee;text-align:center">DJ BIGSAM RSA Studio V2<br><small style="color:#888">0789313670</small></h2>

<textarea id="lyrics" placeholder="TYPE HERE - THIS WILL WORK - JUST TYPE" style="width:100%;height:220px;background:#111;color:#fff;border:3px solid #22d3ee;border-radius:10px;padding:12px;font-size:20px"></textarea>

<div id="live" style="background:#111;border:1px solid #333;padding:10px;border-radius:8px;margin-top:8px;min-height:40px;color:#22d3ee;white-space:pre-wrap">Your typing appears here...</div>

<button onclick="testType()" style="width:100%;padding:15px;background:#22d3ee;color:#000;font-weight:900;border-radius:10px;border:0;margin-top:10px;font-size:18px">TEST - Click to show what you typed</button>

<button onclick="save()" style="width:100%;padding:15px;background:#222;color:#fff;font-weight:900;border-radius:10px;border:0;margin-top:8px;border:1px solid #333">💾 Save Lyrics</button>

<a href="https://wa.me/27789313670" style="display:block;text-align:center;background:#25D366;color:#000;padding:14px;border-radius:10px;text-decoration:none;font-weight:900;margin-top:10px">📱 WhatsApp 0789313670</a>

<script>
// NO IMPORTS - PLAIN JS ONLY - CANNOT FAIL
var box = document.getElementById('lyrics');
var live = document.getElementById('live');

box.addEventListener('input', function(){
  live.textContent = this.value;
});

function testType(){
  var t = box.value;
  if(!t){ alert('Type something first! Box is empty'); return; }
  alert('YOU TYPED:\n\n' + t + '\n\nTyping works! ✅');
  live.textContent = t;
}

function save(){
  var t = box.value;
  if(!t){ alert('Type first'); return; }
  localStorage.setItem('dj_lyrics', t);
  alert('Saved! ' + t.length + ' chars');
}

// Load saved
var saved = localStorage.getItem('dj_lyrics');
if(saved){
  box.value = saved;
  live.textContent = saved;
}
</script>

</body>
</html>
