<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ BIGSAM - Typing Fix</title>
</head>
<body style="background:#000;color:#fff;font-family:Arial;padding:15px">

<h2 style="color:cyan">DJ BIGSAM RSA Studio V2<br><small style="color:#888">0789313670 - Typing Test</small></h2>

<!-- SUPER SIMPLE TEXTAREA - NO JS TO BLOCK IT -->
<textarea id="lyrics" placeholder="TYPE HERE NOW - This must work - Type anything" style="width:100%;height:200px;background:#111;color:#fff;border:2px solid cyan;border-radius:8px;padding:12px;font-size:18px"></textarea>

<p id="live" style="color:cyan;background:#111;padding:10px;border-radius:8px;min-height:30px">Your typing will appear here live...</p>

<p id="count">0 chars</p>

<button onclick="alert(document.getElementById('lyrics').value)" style="width:100%;padding:15px;background:cyan;color:#000;font-weight:900;border-radius:10px;border:0;font-size:18px">TEST - SHOW WHAT I TYPED</button>

<button onclick="explain()" style="width:100%;padding:15px;background:#7c3aed;color:#fff;font-weight:900;border-radius:10px;border:0;margin-top:10px;font-size:18px">🤖 EXPLAIN MY LYRICS</button>

<div id="explain" style="background:#111;border:1px solid #333;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap">Explanation here</div>

<a href="https://wa.me/27789313670" style="display:block;text-align:center;background:#25D366;color:#000;padding:12px;border-radius:10px;text-decoration:none;margin-top:10px;font-weight:900">WhatsApp 0789313670</a>

<script>
// SIMPLEST JS - Cannot block typing
let el = document.getElementById('lyrics');
let live = document.getElementById('live');
let count = document.getElementById('count');

el.addEventListener('input', function(){
  live.textContent = this.value;
  count.textContent = this.value.length + " chars - Typing works!";
  // For WhatsApp
  localStorage.setItem('dj_lyrics', this.value);
});

// Load saved
el.value = localStorage.getItem('dj_lyrics') || '';
live.textContent = el.value;
count.textContent = el.value.length + " chars";

function explain(){
  let txt = el.value.trim();
  if(!txt){ alert("Type lyrics first!"); return; }
  document.getElementById('explain').textContent = "YOUR EXACT LYRICS:\n\n" + txt + "\n\nMood: Amapiano Love\nBPM: 115\nKey: F Minor\nChords: F - G - Em - Am\n\nTip: Perfect for Durban clubs!\n\nBook: 0789313670";
  
  // Try online AI too
  fetch("https://text.pollinations.ai/"+encodeURIComponent("Explain: "+txt))
    .then(r=>r.text())
    .then(ai=>{ document.getElementById('explain').textContent += "\n\n--- AI ---\n" + ai; })
    .catch(()=>{});
}
</script>

</body>
</html>
